<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方块豆人：塌了就出局 · BlockBean Collapse</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" href="concept/blockbean_keyart.jpg" as="image">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
<style>
:root{--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#hud{position:fixed;top:10px;left:10px;color:#fff;text-shadow:0 2px 3px #000;font-size:18px;line-height:1.45;z-index:4;pointer-events:none}
#msg{position:fixed;top:37%;width:100%;text-align:center;font-size:clamp(42px,8vw,76px);font-weight:800;color:#fff;text-shadow:0 3px 6px #000;z-index:4;pointer-events:none}
#splash{position:fixed;inset:0;background:#000c url(concept/blockbean_keyart.jpg) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:8;text-shadow:0 2px 6px #000;padding:24px;text-align:center}
#splash h1{font-size:clamp(34px,7vw,58px);margin:0}#splash p{max-width:720px}
#splash button,#replayBtn,#copyBtn{font-size:20px;padding:12px 28px;border:0;border-radius:12px;background:#ffcc00;color:#231f20;cursor:pointer}
#splash button:disabled{opacity:.5;cursor:wait}
#loadbar-wrap{width:min(420px,80vw);height:14px;background:#ffffff33;border-radius:8px;margin-top:16px;overflow:hidden;border:1px solid #fff6}
#loadbar{height:100%;width:0%;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:width .15s ease;border-radius:8px}
#load{margin-top:10px;font-size:16px;opacity:.95}
#result{position:fixed;inset:0;display:grid;place-items:center;background:#08111dcc;z-index:7;padding:20px}
#result[hidden]{display:none}
.result-card{width:min(520px,92vw);background:#fff;border-radius:20px;padding:24px;text-align:center;color:#1e293b;box-shadow:0 18px 60px #0008}
.result-card h2{font-size:38px;margin:0 0 8px}.result-card p{margin:8px 0 18px}
#shareText{width:100%;min-height:76px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit;resize:none}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#stickZone{position:absolute;left:18px;bottom:calc(18px + var(--safe));width:132px;height:132px;border-radius:50%;background:#0003;border:2px solid #fff7;pointer-events:auto}
#stickKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#fff9;border:2px solid #fff;transition:transform .04s linear}
.touch-btn{position:absolute;bottom:calc(28px + var(--safe));width:72px;height:72px;border-radius:50%;border:2px solid #fff8;background:#111a;color:#fff;font-size:16px;font-weight:700;pointer-events:auto}
#jumpBtn{right:116px}#pushBtn{right:28px;bottom:calc(92px + var(--safe))}
#spectateBtn,#muteBtn{position:absolute;right:16px;top:16px;border:1px solid #fff8;border-radius:10px;background:#111a;color:#fff;padding:8px 12px;pointer-events:auto}
#muteBtn{top:58px}#spectateLabel{position:absolute;right:16px;top:98px;color:#fff;text-shadow:0 2px 3px #000;font-size:14px}
@media (min-width:800px){#touch{opacity:.75}.touch-btn,#stickZone{opacity:.42}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="hud"></div><div id="msg"></div>
<div id="splash"><h1>方块豆人：塌了就出局</h1><p>BlockBean Collapse · 方块塌了就出局，推开对手，最后一豆称王</p><div id="loadbar-wrap"><div id="loadbar"></div></div><p id="load">加载模型中… 0%</p><button id="start" disabled>开始 / Start</button></div>
<div id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultDetail"></p><textarea id="shareText" readonly></textarea><div class="result-actions"><button id="copyBtn">复制分享文案</button><button id="replayBtn">再来一局（R）</button></div></div></div>
<div id="touch"><div id="stickZone" aria-label="移动摇杆"><div id="stickKnob"></div></div><button class="touch-btn" id="jumpBtn">跳</button><button class="touch-btn" id="pushBtn">推</button><button id="spectateBtn">切换观战</button><button id="muteBtn">🔊 音效</button><div id="spectateLabel"></div></div>
<script type="module" src="game.js?v=wave2-1"></script>
</body></html>
